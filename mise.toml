min_version = "2024.9.5"

[tools]
node = "26.12.1"
python = "{{ get_env(name='PYTHON_VERSION', default='3.13') }}"
pre-commit = "4.6.2"
npm = "12.2.1"
just = "1.58.0"

[settings]
lockfile = true

[env]
_.file = [".env.secrets", ".env.local"]

ENV = "dev"

[tasks.hooks]
description = "Install canonical pre-commit and pre-push Git hooks"
run = '''
pre-commit install --install-hooks --hook-type pre-commit
pre-commit install --config .pre-commit-pre-push.yaml --install-hooks --hook-type pre-push
'''

[tasks.hooks-update]
description = "Explicitly update pinned pre-commit hook revisions"
run = "pre-commit autoupdate"

[tasks.quality]
description = "Run the canonical publication quality gate"
run = "bash scripts/quality-gate.sh"

[tasks.agent-fix]
description = "Apply/check deterministic pre-commit fixes for agent changes"
run = "bash scripts/agent-quality-gate.sh --fix"

[tasks.agent-quality]
description = "Run the strict agent-first local quality gate"
run = "bash scripts/agent-quality-gate.sh"

[tasks.agent-publish]
description = "Run or reuse the exact strict publication proof for the current HEAD/base/toolchain"
run = "bash scripts/agent-publish.sh"
