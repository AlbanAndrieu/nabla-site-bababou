fail_fast: true
minimum_pre_commit_version: 4.2.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: forbid-new-submodules
      - id: detect-private-key
      - id: mixed-line-ending
      - id: check-added-large-files
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-xml
      - id: file-contents-sorter
      - id: name-tests-test
      - id: check-case-conflict
      - id: check-illegal-windows-names

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.6
    hooks:
      - id: biome-check
        name: "🟨 javascript · Lint, format, and safe fixes with Biome"
        additional_dependencies: ["@biomejs/biome@2.4.12"]
        exclude: >
          (?x)^(
              public/assets/.*|
              tests/.*|
              public/.*|
          )$

  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: v17.14.1
    hooks:
      - id: stylelint
        additional_dependencies:
          - stylelint@14.4.0
          - stylelint-config-standard-scss@3.0.0

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: "✨ misc-files · Format misc web files"
        types_or: [yaml, html, scss, json, markdown]
        additional_dependencies:
          - prettier@3.4.2

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: "📜 yamllint - Lint Yaml"
        args: [--format, parsable, --strict]

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks-docker
        name: "🔒 🐳 security · Detect hardcoded secrets"
        entry: zricethezav/gitleaks protect --verbose --redact --staged --config .gitleaks.toml
