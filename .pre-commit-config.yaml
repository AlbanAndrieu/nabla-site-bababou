fail_fast: false
minimum_pre_commit_version: 4.2.0
exclude: |
  (?x)^(
      .*\{\{.*\}\}.*|     # Exclude any files with cookiecutter variables
      docs/site/.*|       # Exclude mkdocs compiled files
      docs/_build/.*|
      \.history/.*|       # Exclude history files
      .*cache.*/.*|       # Exclude cache directories
      .*venv.*/.*|        # Exclude virtual environment directories
      .direnv/.*|
      .yarn/.*|
      .ansible/.*|
      node_modules/.*|
      reports/.*|
      .npm/.*|
      .nuxt/.*|
      .netlify.*|
      .vercel/.*|
  )$
ci:
  # format compatible with commitlint
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: monthly
  autofix_commit_msg: |
    chore: auto fixes from pre-commit.com hooks
    for more information, see https://pre-commit.ci
  skip:
    # https://github.com/pre-commit-ci/issues/issues/55
  -   pip-compile
  -   pyright
  -   schemas
  submodules: true
default_install_hook_types:
-   pre-commit
-   pre-push

default_stages:
-   pre-commit

repos:
  # ---------------------------------------------------------------------------- #
  #                              🔄 Pre-Commit Hooks                             #
  # ---------------------------------------------------------------------------- #
  # Hook revision maintenance is deliberately not executed during every commit.
  # Keep `pre-commit autoupdate` as an explicit maintenance operation instead.

    # ---------------------------- 📁 Filesystem Tools --------------------------- #
-   repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        name: "📁 filesystem/⚙️ exec · Remove trailing whitespace"
        args: [--markdown-linebreak-ext=md]
        exclude: >
          (?x)^(
              api/honeypot/.*|
          )$
    -   id: fix-byte-order-marker
        name: "📁 filesystem/⚙️ exec · Verify byte order"
    -   id: mixed-line-ending
        name: "📁 filesystem/⚙️ exec · Verify mixed line ending"
        args: [--fix=lf]
    -   id: end-of-file-fixer
        name: "📁 filesystem/⚙️ exec · Verify end of file"
        exclude: >
          (?x)^(
              api/honeypot/.*|
          )$
    -   id: check-executables-have-shebangs
        name: "📁 filesystem/⚙️ exec · Verify shebang preset"
    -   id: check-shebang-scripts-are-executable
        name: "📁 filesystem/⚙️ exec · Verify script permissions"
    -   id: check-symlinks
        name: "📁 filesystem/🔗 symlink · Check symlink validity"
    -   id: destroyed-symlinks
        name: "📁 filesystem/🔗 symlink · Detect broken symlinks"
    -   id: debug-statements
        name: "📁 filesystem/📝 debug · Check debug statements"
    -   id: check-ast
        name: "📁 filesystem/📝 ast · Check ast"
    -   id: check-builtin-literals
        name: "📁 filesystem/📝 literals · Check builtin literals"
    -   id: check-case-conflict
        name: "📁 filesystem/📝 names · Check case sensitivity"
    -   id: check-illegal-windows-names
        name: "📁 filesystem/📝 names · Validate Windows filenames"
    -   id: check-docstring-first
        name: "📁 filesystem/📝 docstring · Validate docstring first"
    -   id: name-tests-test
        name: "📁 filesystem/📝 names · Check tests names"
        exclude: >
          (?x)^(
              tests/.*|
          )$
    -   id: check-json
        name: "📁 filesystem/📝 json · Check json"
        exclude: >
          (?x)^(
            ^.vscode/.*|
            .devcontainer/devcontainer.json|
          )$
    -   id: check-toml
        name: "📁 filesystem/📜 toml - Check toml"
    -   id: check-xml
        name: "📁 filesystem/📜 xml - Check xml"
    -   id: check-yaml
        name: "📁 filesystem/📜 yaml - Check yaml"
        args: [--allow-multiple-documents]
        exclude: >
          (?x)^(
            .gitlab-ci.yml|
            .github/workflows/ci.yml|
          )$
    -   id: sort-simple-yaml
        name: "🔀 sort/📜 yaml - Sort yaml"
    -   id: file-contents-sorter
        name: "🔀 sort/📜 file · Sort contents"
    -   id: requirements-txt-fixer
        name: "🔀 sort/🐍 json · Sort requirements"
    -   id: check-merge-conflict
        name: "🌳 git · Detect conflict markers"
    -   id: forbid-new-submodules
        name: "🌳 git · Prevent submodule creation"
    -   id: check-added-large-files
        name: "🌳 git · Block large file commits"
        args: [--maxkb=123]
        exclude: >
          (?x)^(
            .pnp.cjs|
            package-lock.json|
            npm-shrinkwrap.json|
            poetry.lock|
            Pipfile.lock|
            yarn.lock|
            sbom.json|
            pnpm-lock.yaml|
            public/wireframe.css|
            cv/cv-aandrieu-XX-XX-.*|
            public/cv/fonts/segoeuib.ttf|
            vue-client/package-lock.json|
            public/assets/fontawesome-free-7.1.0-web/.*|
            public/assets/fontawesome/.*|
            public/assets/.*.png|
            public/other/.*.png|
            public/assets/.*.svg|
            public/other/nabla-build-architecture.jpg|
            public/checklist/article/index.html|
            public/cv/alban-andrieu-19-12-2017.png|
            public/arf.json|
            public/assets/mushroom.webp|
            public/d3.v3.min.js|
            public/assets/cover-geek.jpg|
            public/checklist/about/index.html|
            public/checklist/index.html|
            public/checklist/checklist/index.html|
          )$
    -   id: detect-private-key
        name: "🔒 security · Detect private keys"

-   repo: https://github.com/pre-commit/pre-commit.git
    rev: v4.6.2
    hooks:
    -   id: validate_manifest
        name: "🤖 manifest · Validate manifest scripts"

-   repo: https://github.com/doublify/pre-commit-hindent.git
    rev: b3680b6ebf9f7cf29b19307f246adef66756feef
    hooks:
    -   id: hindent
        name: "🤖 hindent · Format scripts"

-   repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
    -   id: add-trailing-comma
        name: "🤖 comma · Add trailing comma"

    ### Python Tools ###
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        name: "🐍 python · Py Upgrade"
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
    -   id: ruff-format
        name: "🐍 python · Format with Ruff"

    -   id: ruff-check
        name: "🐍 python · Check and perform unsafe auto-fixes with Ruff"
        args: [--fix, --unsafe-fixes]

-   repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
    -   id: validate-pyproject
        name: "🐍 python · Validate pyproject.toml"
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

    ### Shell ###
-   repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
    -   id: shfmt
        name: "🐚 shell · Format shell scripts"
        # Native prebuilt shfmt hook: no Docker daemon/socket required.
        # shfmt remains the single shell-indentation authority, aligned with Site Alban #177.
        args: ["-i", "4", "-ci"]
-   repo: https://github.com/detailyang/pre-commit-shell
    rev: v1.0.6
    hooks:
    -   id: shell-lint
        name: "🐚 shell · Lint shell scripts"
        args: [-x]
        exclude: >
          (?x)^(
            mvnw|
            biscuitcutter.sh|
            hooks|
            tests/.*|
            docs/Makefile|
            .envrc|
            scripts/run-wicked.sh|
            scripts/convert-.*.sh|
          )$

-   repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
    -   id: bashate
        name: "🐚 shell · Check shell script code style"
        # E002 is indentation, already canonicalized by shfmt above.
        args: [-i, "E002,E003,E006"]
        exclude: >
          (?x)^(
            trunk|
            scripts/run-python.sh|
            scripts/run-wicked.sh|
            scripts/convert-.*.sh|
            .envrc|
          )$

    ### Makefile ###
-   repo: https://github.com/mrtazz/checkmake.git
    rev: v0.3.2
    hooks:
    -   id: checkmake
        name: "🐮 Makefile · Lint Makefile"

    ### Notebooks ###
-   repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
    -   id: nbqa
        entry: nbqa mdformat
        name: "📓 notebook · Format markdown cells"
        args: ["--nbqa-md"]
        types: [jupyter]
        additional_dependencies:
        -   mdformat
        -   mdformat-gfm
        -   mdformat-ruff
        -   mdformat-frontmatter
        -   ruff

    ### Javascript & Web Tools ###
-   repo: https://github.com/biomejs/pre-commit
    rev: "v2.5.6"
    hooks:
    -   id: biome-check
        name: "🟨 javascript · Lint, format, and safe fixes with Biome"
        additional_dependencies: ["@biomejs/biome@2.4.12"]
        exclude: >
          (?x)^(
              trivy-sbom.json|
              public/assets/fontawesome-free-7.1.0-web/.*|
              public/assets/fontawesome/.*|
              public/cv-markdown-export.js|
              public/arf.js|
              public/index.js|
              public/d3.v3.min.js|
              public/people-cards.js|
              public/analytics-stubs.js|
              public/site-analytics.js|
              public/site-google-translate.js|
              public/site-widgets.js|
              public/theme-toggle.js|
              tests/.*|
              api/hello.js|
              vue-client/.*|
              server.cjs|
          )$

-   repo: https://github.com/Lucas-C/pre-commit-hooks-nodejs
    rev: v1.1.2
    hooks:
    -   id: htmllint
        name: "📝 html · Lint html"
        args: [--config, .eslintrc.json]
        files: ^src/
    -   id: htmlhint
        name: "📝 html · Hint html"
        args: [--config, .htmlhintrc]
        exclude: >
          (?x)^(
            public/reports/.*|
            public/checklist/.*|
          )$
    -   id: markdown-toc
        name: "📝 markdown · Toc markdown"
        args: [--maxdepth, "3", -i]

    ### Additional File Types ###
-   repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
    -   id: prettier
        name: "✨ misc-files · Format misc web files"
        types_or: [yaml, html, scss]
        additional_dependencies:
        -   prettier@3.4.2
        exclude: >
          (?x)^(
            trivy-sbom.json|
            pnpm-lock.yaml|
            public/login.html|
            public/cv/index.html|
            public/reports/.*|
            api/honeypot/.*|
            public/assets/fontawesome-free-7.1.0-web/.*|
            public/assets/fontawesome/.*|
            .pre-commit-config.yaml|
            public/checklist/.*|
          )$

    ### Data & Config Validation ###
-   repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
    -   id: check-github-workflows
        name: "🧩 github-actions · Validate gh workflow files"
        args: ["--verbose"]
    -   id: check-taskfile
        name: "✅ taskfile · Validate Task configuration"

    # Pin both tools to the reviewed Site Alban workflow-audit baseline.
    # actionlint validates Actions syntax/contexts; zizmor audits security offline.
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    -   id: actionlint
        name: "🧩 github-actions · Lint workflows with actionlint"

-   repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
    -   id: zizmor
        name: "🔒 github-actions · Audit workflows with zizmor"
        args: ["--offline"]
        files: ^\.github/(workflows/[^/]+\.ya?ml|actions/.+/action\.ya?ml|dependabot\.ya?ml)$

    ### Deployment Tools ###
-   repo: https://github.com/hadolint/hadolint
    rev: v2.15.0
    hooks:
    -   id: hadolint-docker
        name: "🐳 hadolint · Validate Dockerfile"
        # The upstream Docker hook otherwise pulls a mutable latest image.
        # Keep its runtime version aligned with the reviewed pre-commit revision.
        entry: ghcr.io/hadolint/hadolint:v2.15.0 hadolint

    ### Security Tools ###
-   repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
    -   id: bandit
        name: "🔒 security · Detect security issues"
        args: [-c, .bandit.yml]
        exclude: >
          (?x)^(
            noxfile.py|
            versioneer.py|
            hooks/_version.py|
            hooks/tests/|
            ccds/hook_utils/configure_vcs.py|
            ccds/hook_utils/configure_gh.py|
            ccds/hook_utils/configure_ssh.py|
            ccds/hook_utils/custom_config.py|
          )$

-   repo: https://github.com/IamTheFij/ansible-pre-commit
    rev: v1.0.1
    hooks:
    -   id: encryption-check
        name: "🔒 security · Detect encryption"
        exclude: >
          (?x)^(
            public/assets/fontawesome-free-7.1.0-web/.*|
          )$

# Betterleaks is the canonical secret scanner.
# Use the upstream native Go hook: no Docker daemon/socket is required.
-   repo: https://github.com/betterleaks/betterleaks
    rev: v1.9.0
    hooks:
    -   id: betterleaks
        name: "🔒 security · Detect hardcoded secrets with Betterleaks"
        entry: >-
          betterleaks git --pre-commit --staged --redact --config .betterleaks.toml

    ### Ansible ###
    # Disable because too slow
    # - repo: https://github.com/ansible-community/ansible-lint.git
    #   rev: v25.9.2
    #   hooks:
    #     - id: ansible-lint
    #       name: "📜 ansible - Lint Ansible"

-   repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
    -   id: yamllint
        name: "📜 yamllint - Lint Yaml"
        args: [--format, parsable, --strict]
        exclude: >
          (?x)^(
            .pnp.cjs|
            package-lock.json|
            bababou-app/package-lock.json|
            npm-shrinkwrap.json|
            poetry.lock|
            Pipfile.lock|
            yarn.lock|
            sbom.json|
            pnpm-lock.yaml|
          )$

    # ---------------------------------------------------------------------------- #
    #                            📝 Commit Message Hooks                           #
    # ---------------------------------------------------------------------------- #
    # Commit-message validation remains intentionally disabled in this repository.

    # ---------------------------------------------------------------------------- #
    #                            👑 Mega linter                                    #
    # ---------------------------------------------------------------------------- #
    # MegaLinter remains disabled here because the incremental local/project gates
    # are substantially cheaper and already cover the active source surfaces.

# Local-first manifest integrity, ported from nabla-compose PR #269.
# Runs without fetching hooks; installation via the existing Python pre-commit environment.
-   repo: local
    hooks:
    -   id: precommit-integrity
        name: "🔎 quality · Reject duplicate pre-commit hooks and repositories"
        language: system
        entry: python3 scripts/quality/check-precommit-config.py
        pass_filenames: false
        files: '^([.]pre-commit-config[.]yaml|scripts/quality/check-precommit-config[.]py|unit-tests/test_precommit_integrity[.]py)$'
