name: Rewrite protected child identity

on:
  push:
    branches:
      - refactor/next-migration-4-home-privacy-gate
    paths:
      - ".github/workflows/privacy-rewrite-home.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/next-migration-4-home-privacy-gate
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rewrite protected identity without storing source names
        run: node --import tsx scripts/rewrite-protected-child-identity.ts public/index.html
      - name: Commit rewritten home
        run: |
          if git diff --quiet -- public/index.html; then
            echo "No rewrite required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix(privacy): pseudonymize child identity on home"
          git push origin HEAD:refactor/next-migration-4-home-privacy-gate
