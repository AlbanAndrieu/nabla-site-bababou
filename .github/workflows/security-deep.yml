name: Security deep scan (master)

# No heavy filesystem/CodeQL/Nuclei scans on PRs. Outputs remain private.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-deep-master
  cancel-in-progress: true

jobs:
  trivy-repository:
    name: Trivy filesystem, licenses and SBOM
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject private publication sources
        shell: bash
        run: |
          set -euo pipefail
          for path in .private-publication-source .redaction-work; do
            if [[ -e "$path" ]]; then
              echo "::error::Forbidden private publication source: $path"
              exit 1
            fi
          done
      - name: Trivy full filesystem (lockfile, licenses, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-master.json
          exit-code: "0"
          version: v0.74.0
          skip-dirs: .git,node_modules,.next,.vercel,dist,reports
      - name: Validate Trivy scan results and summarize debt
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.Results | type == "array"' trivy-master.json >/dev/null
          jq -r '[.Results[]?.Vulnerabilities[]? | .Severity] | group_by(.) | map({severity: .[0], count: length})' trivy-master.json \
            | jq -c . | sed 's/^/Trivy packages by severity: /'
          echo "Trivy filesystem scan succeeded; production npm audit remains the PR blocking SCA control." >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy CycloneDX SBOM (filesystem including npm lockfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: sbom-master.cdx.json
          exit-code: "0"
          version: v0.74.0
          skip-dirs: .git,node_modules,.next,.vercel,dist,reports
      - name: Verify CycloneDX contents
        shell: bash
        run: |
          jq -e '.bomFormat == "CycloneDX" and (.components | type == "array")' sbom-master.cdx.json >/dev/null
      - name: Preserve approved master artifacts privately
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trivy-master-${{ github.run_id }}
          path: |
            trivy-master.json
            sbom-master.cdx.json
          retention-days: 3
          if-no-files-found: error
      - name: Enforce CRITICAL Trivy findings after evidence retention
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.Results | type == "array"' trivy-master.json >/dev/null
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-master.json)"
          echo "Trivy full-repository CRITICAL findings: ${critical}" >> "$GITHUB_STEP_SUMMARY"
          if (( critical > 0 )); then
            echo "::error::CRITICAL vulnerabilities found in the full repository dependency graph; inspect retained private Trivy report."
            exit 1
          fi

  codeql:
    name: CodeQL JS/TS full codebase
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # CodeQL analyze queries its own workflow run metadata
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze with CodeQL, no public upload required
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: security-deep-js
          upload: never
          output: codeql-sarif
          upload-database: "false"
      - name: Private CodeQL SARIF evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codeql-master-${{ github.run_id }}
          path: codeql-sarif/*.sarif
          retention-days: 3
          if-no-files-found: error

  semgrep-full:
    name: Semgrep full SAST
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Full source Semgrep with SARIF, no private sources
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/python" -m pip install --disable-pip-version-check --quiet 'semgrep==1.145.0' 'pydantic==2.12.5'
          SEMGREP_SEND_METRICS=off "${RUNNER_TEMP}/semgrep/bin/semgrep" scan \
            --config p/ci --error --metrics=off --sarif --output semgrep-master.sarif \
            app components i18n lib scripts api
      - name: Preserve full Semgrep findings
        if: always() && hashFiles('semgrep-master.sarif') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: semgrep-master-${{ github.run_id }}
          path: semgrep-master.sarif
          retention-days: 3

  nuclei-public:
    name: Nuclei bounded public templates
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # ~4,885 templates at 2 req/s need >40 minutes even before bootstrap.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Nuclei and verify real templates (Alban #338 parity)
        shell: bash
        env:
          # GitHub token is for template updater API quota only; never sent to scan targets.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/nuclei.zip"
          curl --fail --location --silent --show-error --max-time 90 \
            "https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip" --output "$archive"
          printf '%s  %s\n' 'ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6' "$archive" | sha256sum --check --status
          unzip -p "$archive" nuclei > "${RUNNER_TEMP}/nuclei"
          chmod 700 "${RUNNER_TEMP}/nuclei"
          "${RUNNER_TEMP}/nuclei" -version
          templates_dir="${HOME}/nuclei-templates"
          "${RUNNER_TEMP}/nuclei" -ut
          if [[ ! -d "$templates_dir" ]]; then
            echo "::error::NUCLEI_TEMPLATES_UNAVAILABLE: no template directory"
            exit 1
          fi
          first_template="$(find "$templates_dir" -type f \( -name '*.yaml' -o -name '*.yml' \) -print -quit)"
          if [[ -z "$first_template" ]]; then
            echo "::error::NUCLEI_TEMPLATES_UNAVAILABLE: no usable YAML template; scan NOT_RUN"
            exit 1
          fi
          echo "NUCLEI_TEMPLATE_DIR=$templates_dir" >> "$GITHUB_ENV"

      - name: Scan fixed canonical public origin (rate 2/s, no OAST)
        id: nuclei
        shell: bash
        env:
          NUCLEI_DISABLE_UPDATE_CHECK: "true"
          NUCLEI_NO_COLOR: "true"
        run: |
          set -euo pipefail
          umask 077
          scan_dir="$(mktemp -d "${RUNNER_TEMP}/nuclei-bababou.XXXXXX")"
          echo "NUCLEI_SCAN_DIR=$scan_dir" >> "$GITHUB_ENV"
          # Reviewed per-template exceptions, never arbitrary tags or paths.
          excludes=()
          while IFS= read -r template_id || [[ -n "$template_id" ]]; do
            [[ -z "$template_id" || "$template_id" == \#* ]] && continue
            if [[ ! "$template_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error::NUCLEI_EXCLUSION_INVALID: non-allowlisted template ID"
              exit 1
            fi
            excludes+=("$template_id")
          done < .nuclei/ignore-templates.txt
          exclusion_args=()
          if (( ${#excludes[@]} )); then
            joined="$(IFS=,; echo "${excludes[*]}")"
            exclusion_args=(-eid "$joined")
          fi
          echo "NUCLEI_EXCLUSION_COUNT=${#excludes[@]}" >> "$GITHUB_ENV"
          # Leave 5 minutes inside the job budget for report minimization,
          # cleanup and reliable INCOMPLETE status (rather than GitHub cancellation).
          # timeout(1) returns 124 on expiry; raw output remains runner-local.
          scan_started_at="$(date +%s)"
          set +e
          timeout --signal=TERM --kill-after=15s 3300s \
            "${RUNNER_TEMP}/nuclei" -u https://www.bababou.com \
            -t "$NUCLEI_TEMPLATE_DIR" \
            -pt http -ni -duc -tags cve,misconfig,exposure \
            -severity medium,high,critical -etags dos,fuzz,bruteforce,intrusive \
            -rl 2 -c 1 -timeout 5 -retries 0 \
            -jsonl -o "$scan_dir/nuclei.raw.jsonl" \
            "${exclusion_args[@]}" \
            > "$scan_dir/scan.log" 2>&1
          scan_exit=$?
          set -e
          scan_elapsed_seconds=$(( $(date +%s) - scan_started_at ))
          echo "NUCLEI_SCAN_ELAPSED_SECONDS=$scan_elapsed_seconds" >> "$GITHUB_ENV"
          if (( scan_exit == 124 || scan_exit == 137 )); then
            echo "NUCLEI_SCAN_TIMEOUT=true" >> "$GITHUB_ENV"
            echo "::error::NUCLEI_SCAN_TIMEOUT: bounded scan exceeded 55 minutes; findings INCOMPLETE, not zero"
            exit 1
          fi
          # Never publish raw scan logs. A WAF checkpoint invalidates coverage.
          if grep -Eiq 'no templates provided for scan|no templates found|no templates loaded|no templates to run' "$scan_dir/scan.log"; then
            echo "::error::NUCLEI_TEMPLATES_UNAVAILABLE: scan did not load templates"
            exit 1
          fi
          if grep -Eiq 'too many requests|security checkpoint|x-vercel-mitigated|HTTP[ /]+429|HTTP[ /]+402|response[^[:cntrl:]]{0,30}429' "$scan_dir/scan.log"; then
            echo "::error::NUCLEI_COVERAGE_BLOCKED: WAF or platform denied requests; raw log withheld"
            exit 1
          fi
          if (( scan_exit != 0 )); then
            echo "::error::NUCLEI_SCAN_INCOMPLETE: scanner error; raw log withheld"
            exit 1
          fi
          test -e "$scan_dir/nuclei.raw.jsonl" || : > "$scan_dir/nuclei.raw.jsonl"
          node scripts/security/nuclei-safe-report.mjs "$scan_dir/nuclei.raw.jsonl" nuclei-master.sarif

      - name: Summarize Nuclei only after a complete sanitized scan
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.nuclei.outcome }}
        run: |
          if [[ "$SCAN_OUTCOME" != "success" ]]; then
            echo "## Nuclei Bababou — INCOMPLETE / NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "No reliable count: scanner, template bootstrap, WAF or 55-minute scan deadline blocked coverage." >> "$GITHUB_STEP_SUMMARY"
            echo "Elapsed seconds: ${NUCLEI_SCAN_ELAPSED_SECONDS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
            echo "Scanner timeout: ${NUCLEI_SCAN_TIMEOUT:-false}" >> "$GITHUB_STEP_SUMMARY"
          else
            node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("nuclei-master.sarif","utf8"));const a=r.runs[0].results;console.log("## Nuclei Bababou — COMPLETE");console.log("Sanitized medium/high/critical matches: "+a.length+"; not verified vulnerabilities. Raw URLs and HTTP withheld.")' >> "$GITHUB_STEP_SUMMARY"
            echo "Reviewed template exclusions: ${NUCLEI_EXCLUSION_COUNT:-0}" >> "$GITHUB_STEP_SUMMARY"
            echo "Elapsed seconds: ${NUCLEI_SCAN_ELAPSED_SECONDS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Erase runner-local raw Nuclei evidence
        if: always()
        shell: bash
        run: |
          if [[ -n "${NUCLEI_SCAN_DIR:-}" && "$NUCLEI_SCAN_DIR" == "$RUNNER_TEMP"/nuclei-bababou.* ]]; then
            rm -rf -- "$NUCLEI_SCAN_DIR"
          fi

      - name: Upload only sanitized Nuclei SARIF (3 days)
        if: steps.nuclei.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nuclei-master-${{ github.run_id }}
          path: nuclei-master.sarif
          retention-days: 3
          if-no-files-found: error
