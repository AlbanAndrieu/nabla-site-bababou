---
name: Docker CI

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "public/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "public/**"
      - ".github/workflows/docker-build.yml"
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:
    inputs:
      publish_dockerhub:
        description: "Also publish the fallback image to Docker Hub"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LOCAL_IMAGE: nabla-site-bababou:ci
  GHCR_IMAGE: ghcr.io/albanandrieu/nabla-site-bababou
  DOCKERHUB_IMAGE: nabla/nabla-site-bababou

jobs:
  build:
    name: Build static fallback
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build fallback image
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test fallback container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm --publish 127.0.0.1:18080:8080 "${LOCAL_IMAGE}")"
          cleanup() {
            docker stop "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/fallback-index.html; then
              break
            fi
            if [[ "${attempt}" -eq 20 ]]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done

          grep --ignore-case --quiet "<html" /tmp/fallback-index.html
          curl --fail --silent --show-error \
            http://127.0.0.1:18080/404.html \
            --output /tmp/fallback-404.html
          grep --ignore-case --quiet "<html" /tmp/fallback-404.html

          for asset in fontawesome.js solid.js brands.js; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:18080/assets/fontawesome-free-7.1.0-web/js/${asset}" \
              --output "/tmp/${asset}"
            test -s "/tmp/${asset}"
          done

          for asset in fontawesome.css solid.css brands.css; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:18080/assets/fontawesome/css/${asset}" \
              --output "/tmp/${asset}"
            test -s "/tmp/${asset}"
          done

          for asset in fa-solid-900.woff2 fa-brands-400.woff2; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:18080/assets/fontawesome/webfonts/${asset}" \
              --output "/tmp/${asset}"
            test -s "/tmp/${asset}"
          done

          runtime_uid="$(docker exec "${container_id}" id -u)"
          if [[ "${runtime_uid}" == "0" ]]; then
            echo "Fallback container unexpectedly runs as root."
            exit 1
          fi
          echo "Fallback container smoke test passed as UID ${runtime_uid}."

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          version: "v0.74.0"
          scanners: "vuln"
          format: "sarif"
          output: "trivy-results.sarif"
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Preserve failed Trivy SARIF report
        if: ${{ steps.trivy-scan.outcome != 'success' && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trivy-sarif-${{ github.sha }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Detect GitHub Code Scanning availability
        if: ${{ always() && steps.trivy-scan.outcome != 'skipped' }}
        id: code-scanning
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?per_page=1" \
            >/dev/null 2>&1; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Code Scanning is unavailable; failed scans retain SARIF as a 7-day diagnostic artifact."
          fi

      - name: Upload Trivy scan results to GitHub Code Scanning
        if: ${{ steps.code-scanning.outputs.enabled == 'true' && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Enforce Trivy vulnerability scan
        if: ${{ always() && steps.trivy-scan.outcome == 'failure' }}
        shell: bash
        run: |
          echo "Trivy found a blocking HIGH/CRITICAL vulnerability or failed to complete."
          echo "Diagnostic SARIF was preserved when available before enforcement."
          exit 1

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish fallback image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${GHCR_IMAGE}:latest"
          docker tag "${LOCAL_IMAGE}" "${GHCR_IMAGE}:${GITHUB_SHA}"
          docker push "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${GITHUB_SHA}"

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Publish fallback image to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish_dockerhub
        shell: bash
        run: |
          set -euo pipefail
          docker tag "${LOCAL_IMAGE}" "${DOCKERHUB_IMAGE}:latest"
          docker tag "${LOCAL_IMAGE}" "${DOCKERHUB_IMAGE}:${GITHUB_SHA}"
          docker push "${DOCKERHUB_IMAGE}:latest"
          docker push "${DOCKERHUB_IMAGE}:${GITHUB_SHA}"

      - name: Image digest
        env:
          IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: echo "$IMAGE_DIGEST"
