name: Semantic Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release-master
  cancel-in-progress: false

jobs:
  release:
    name: Version, changelog and GitHub release
    runs-on: ubuntu-latest
    env:
      RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create dedicated release App token
        id: release_app_token
        if: env.RELEASE_APP_CLIENT_ID != '' && env.RELEASE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ env.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install release dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Release 0.1.0 is the established numeric semantic-release baseline.
      # The repository also contains a historical legacy v0.0.1 tag. Do not
      # recreate a synthetic 0.0.x bootstrap: semantic-release treats that
      # legacy SemVer tag as release history even with a numeric tagFormat.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release_app_token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ steps.release_app_token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # @semantic-release/git pushes the prepared release commit. Keep the
          # credential helper and token in the same step as the authenticated push.
          gh auth setup-git
          npm run semantic-release

      - name: Verify numeric release state
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LATEST_TAG="$(git tag --list --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          if [[ -z "${LATEST_TAG}" ]]; then
            echo "No numeric semantic-release tag exists." >&2
            exit 1
          fi

          if [[ "${LATEST_TAG}" != "${PACKAGE_VERSION}" ]]; then
            echo "package.json version ${PACKAGE_VERSION} does not match latest numeric tag ${LATEST_TAG}." >&2
            exit 1
          fi

          gh release view "${LATEST_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          echo "Verified semantic-release state at ${LATEST_TAG}."
