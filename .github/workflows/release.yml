name: Semantic Release

# Only the completed successful master CI run can trigger release; the
# freshness guard matches the current master SHA before any release mutation.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - CI (Quality and Security)
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-release-master
  cancel-in-progress: false

jobs:
  release:
    name: Version, changelog and GitHub release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    env:
      RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}

    steps:
      # The default GITHUB_TOKEN must never be a fallback for release mutations.
      - name: Resolve release credential policy
        id: release_credentials
        env:
          RELEASE_APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_APP_CLIENT_ID}" && "${RELEASE_APP_PRIVATE_KEY_CONFIGURED}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Semantic Release needs the dedicated GitHub App credentials; release mutation skipped."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Report skipped semantic release
        if: steps.release_credentials.outputs.enabled != 'true'
        shell: bash
        run: |
          {
            echo "## Semantic Release"
            echo
            echo "Release mutation skipped: dedicated GitHub App credentials unavailable."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout validated master revision
        if: steps.release_credentials.outputs.enabled == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Create dedicated release App token
        id: release_app_token
        if: steps.release_credentials.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Configure release Git authentication
        if: steps.release_credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git

      - name: Verify validated revision is still current master
        if: steps.release_credentials.outputs.enabled == 'true'
        id: freshness
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin master:refs/remotes/origin/master --tags
          CURRENT_SHA="$(git rev-parse HEAD)"
          MASTER_SHA="$(git rev-parse origin/master)"

          if [[ "$CURRENT_SHA" != "$MASTER_SHA" ]]; then
            echo "Checkout $CURRENT_SHA is not current master $MASTER_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$VALIDATED_SHA" && "$CURRENT_SHA" != "$VALIDATED_SHA" ]]; then
            echo "Validated revision $VALIDATED_SHA is stale; master is $CURRENT_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: ".nvmrc"

      - name: Install pinned npm from Mise
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
          install_args: npm
          env: false

      - name: Verify npm toolchain
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        shell: bash
        run: bash scripts/verify-mise-npm.sh

      # Bridge existing numeric releases without modifying the published history.
      - name: Adopt v-prefixed semantic-release baseline
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing_v="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          package_version="$(node -p "require('./package.json').version")"
          if [[ -n "$existing_v" ]]; then
            if [[ "$existing_v" != "v${package_version}" ]]; then
              echo "::error::Latest v-prefixed tag and package version differ; manual release-history audit required."
              exit 1
            fi
            echo "Using existing v-prefixed release history: $existing_v"
            exit 0
          fi
          legacy_tag="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -z "$legacy_tag" || "$legacy_tag" != "$package_version" ]]; then
            echo "::error::Legacy tag does not match package version: manual audit required."
            exit 1
          fi
          gh release view "$legacy_tag" --repo "$GITHUB_REPOSITORY" >/dev/null || {
            echo "::error::Legacy numeric tag has no verified GitHub Release."
            exit 1
          }
          target_sha="$(git rev-parse "$legacy_tag^{commit}")"
          git merge-base --is-ancestor "$target_sha" HEAD || {
            echo "::error::Legacy release tag is not an ancestor of current master."
            exit 1
          }
          git tag "v${legacy_tag}" "$target_sha"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${legacy_tag}" -f sha="$target_sha" >/dev/null
          echo "Aliased verified legacy release as v${legacy_tag}."
      - name: Run semantic-release
        if: steps.release_credentials.outputs.enabled == 'true' && steps.freshness.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.release_app_token.outputs.token }}
          GH_TOKEN: ${{ steps.release_app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm exec --yes --ignore-scripts \
            --package=semantic-release@25.0.8 \
            --package=@semantic-release/changelog@7.0.0 \
            --package=@semantic-release/git@11.0.1 \
            --package=@semantic-release/npm@13.1.3 \
            --package=@semantic-release/github@12.0.9 \
            -- semantic-release

