name: Prune migrated legacy message domains

on:
  push:
    branches:
      - refactor/next-migration-4-home-privacy-gate
    paths:
      - ".github/workflows/privacy-prune-legacy-messages.yml"

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Remove namespaces already owned by focused catalogs
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          migrated = ("contactPage", "email", "linkPage")
          for locale in ("en", "fr"):
              path = Path(f"messages/{locale}.json")
              catalog = json.loads(path.read_text(encoding="utf-8"))
              missing = [namespace for namespace in migrated if namespace not in catalog]
              if missing:
                  raise SystemExit(f"expected migrated namespaces missing from {path}: {missing}")
              for namespace in migrated:
                  del catalog[namespace]
              path.write_text(
                  json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Commit legacy catalog pruning
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages/en.json messages/fr.json
          git commit -m "refactor(i18n): remove migrated legacy namespaces"
          git push origin "HEAD:${GITHUB_REF_NAME}"
