name: Playwright Tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      base_url:
        description: "Existing deployment URL to test"
        required: true
        type: string
      git_sha:
        description: "Optional deployed Git SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    playwright-${{
      github.event.client_payload.git.ref ||
      inputs.git_sha ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests on Preview
    permissions:
      contents: read
      id-token: write
      statuses: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.client_payload.url != '' &&
       github.event.client_payload.git.sha != '' &&
       github.event.client_payload.git.ref != 'master' &&
       github.event.client_payload.environment != 'production')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE_URL: >-
        ${{
          inputs.base_url ||
          github.event.client_payload.url
        }}
      DEPLOYED_SHA: >-
        ${{
          inputs.git_sha ||
          github.event.client_payload.git.sha ||
          github.sha
        }}

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.DEPLOYED_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Cache npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned npm from Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
          install_args: npm
          env: false

      - name: Verify npm toolchain
        shell: bash
        run: bash scripts/verify-mise-npm.sh

      # This job exercises an already-built remote Preview. Skip lifecycle
      # scripts to keep dependency installation deterministic and minimal.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve Playwright browser cache version
        id: playwright-version
        shell: bash
        run: |
          PLAYWRIGHT_VERSION="$(node -p "require('@playwright/test/package.json').version")"
          echo "version=${PLAYWRIGHT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Request GitHub OIDC token for Vercel
        id: vercel-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify protected Preview access
        env:
          BASE_URL: ${{ env.PREVIEW_BASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        run: |
          set -euo pipefail

          verify_access() {
            local auth_name="$1"
            shift
            local response_headers
            local status
            local location
            local mitigated

            response_headers="$(mktemp)"
            status="$(curl --silent --show-error \
              --output /dev/null \
              --dump-header "$response_headers" \
              --write-out '%{http_code}' \
              "$@" \
              "$BASE_URL/")"
            location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$response_headers")"
            mitigated="$(awk 'BEGIN { IGNORECASE=1 } /^x-vercel-mitigated:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$response_headers")"

            if [[ "$status" == "402" ]]; then
              echo "::error::PLAYWRIGHT_VERCEL_HTTP_402: Preview blocked by platform quota/account; browser tests not executed."
              rm -f "$response_headers"
              exit 1
            fi
            if [[ "$status" == "429" || ( -n "$mitigated" && "${mitigated,,}" != "none" ) ]]; then
              echo "$auth_name reached a Vercel mitigation or rate limit (HTTP $status)."
              rm -f "$response_headers"
              return 1
            fi

            if grep -Eiq '^location: https://vercel\.com/(login|sso-api)' "$response_headers" || \
              [[ "$status" == "401" || "$status" == "403" ]]; then
              echo "$auth_name rejected by Vercel (HTTP $status)."
              if [[ -n "$location" ]]; then
                echo "Authentication redirect: ${location%%\?*}"
              fi
              rm -f "$response_headers"
              return 1
            fi

            if [[ ! "$status" =~ ^[23][0-9][0-9]$ ]]; then
              echo "$auth_name returned unexpected HTTP $status; Preview unavailable."
              rm -f "$response_headers"
              return 1
            fi
            echo "Vercel Preview access accepted with $auth_name (HTTP $status)."
            rm -f "$response_headers"
            return 0
          }

          bypass_configured=false
          bypass_rejected=false

          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            bypass_configured=true
            if verify_access \
              "Protection Bypass for Automation" \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"; then
              echo "VERCEL_AUTH_MODE=bypass" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "::warning::Header-only bypass was rejected; retrying with Vercel's session-cookie handshake."
            if verify_access \
              "Protection Bypass for Automation with session cookie" \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              --header 'x-vercel-set-bypass-cookie: true'; then
              echo "VERCEL_AUTH_MODE=bypass-cookie" >> "$GITHUB_ENV"
              exit 0
            fi

            bypass_rejected=true
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET was rejected in both supported bypass modes; trying GitHub Actions OIDC fallback."
          fi

          if [[ -n "${VERCEL_TRUSTED_OIDC_TOKEN:-}" ]] && verify_access \
            "GitHub Actions OIDC trusted source" \
            --header "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN"; then
            echo "VERCEL_AUTH_MODE=oidc" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ "$bypass_rejected" == "true" ]]; then
            echo "::error::Vercel rejected the configured Automation Bypass secret in both header-only and session-cookie modes. Confirm that Protection Bypass for Automation is enabled for this exact project and that the GitHub Actions secret contains the generated bypass value."
          elif [[ "$bypass_configured" == "false" ]]; then
            echo "::error::GitHub Actions secret VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
          fi
          echo "::error::GitHub Actions OIDC was also not accepted as a Vercel Trusted Source. HTTP 429 or any x-vercel-mitigated response indicates Vercel protection, not an application success."
          exit 1

      - name: Run Playwright against deployed preview
        id: playwright
        run: npm test -- --project=chromium
        env:
          CI: true
          BASE_URL: ${{ env.PREVIEW_BASE_URL }}
          VERCEL_PREVIEW_PROTECTED: true
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}

      - name: Upload Playwright failure report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure() && !cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 2
          if-no-files-found: ignore

      - name: Failure summary
        if: failure() && !cancelled()
        run: |
          {
            echo "## Playwright tests failed"
            echo
            echo "Target: $BASE_URL"
            echo "Download the **playwright-report** artifact for traces and screenshots when tests reached Playwright."
            echo "Also inspect the exact-SHA **OWASP ZAP Preview** status and runner-local ZAP diagnostics (aggregate-only GitHub summary) to distinguish browser regressions from DAST findings."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BASE_URL: ${{ env.PREVIEW_BASE_URL }}

      - name: Publish Playwright Preview E2E status
        if: >-
          always() &&
          (github.event_name != 'workflow_dispatch' || inputs.git_sha != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ env.DEPLOYED_SHA }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Playwright preview tests passed' ;;
            cancelled) STATE=error; DESCRIPTION='Playwright preview tests cancelled' ;;
            *) STATE=failure; DESCRIPTION='Playwright preview tests failed' ;;
          esac

          payload="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context 'Playwright Preview E2E' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data "$payload"

  production-smoke:
    permissions:
      contents: read
      id-token: write
      statuses: write
    name: Smoke deployed production routes
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.url != '' &&
      github.event.client_payload.git.sha != '' &&
      (github.event.client_payload.git.ref == 'master' ||
       github.event.client_payload.environment == 'production')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_BASE_URL: ${{ github.event.client_payload.url }}
      DEPLOYED_SHA: ${{ github.event.client_payload.git.sha }}
      PUBLIC_BASE_URL: https://www.bababou.com
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Request GitHub OIDC token for Vercel
        id: production-vercel-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Smoke exact production deployment
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.production-vercel-oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          auth_args=()
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            auth_args+=(
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"
            )
          fi
          if [[ -n "${VERCEL_TRUSTED_OIDC_TOKEN:-}" ]]; then
            auth_args+=(
              --header "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN"
            )
          fi
          if ((${#auth_args[@]} == 0)); then
            echo "::error::No Vercel automation credential is available for the production smoke."
            exit 1
          fi

          request() {
            local base_url="$1"
            local path="$2"
            local label="$3"
            local expected_fragment="${4:-}"
            local expected_redirect="${5:-}"
            local headers
            local body
            local status
            local mitigated
            local location

            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$body" \
              --dump-header "$headers" \
              --write-out '%{http_code}' \
              "${auth_args[@]}" \
              "${base_url}${path}")"
            mitigated="$(awk 'BEGIN { IGNORECASE=1 } /^x-vercel-mitigated:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"
            location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"

            if [[ "$status" == "429" || ( -n "$mitigated" && "${mitigated,,}" != "none" ) ]]; then
              echo "$label reached the Vercel Security Checkpoint (HTTP $status)."
              rm -f "$headers" "$body"
              return 2
            fi

            if grep -Eiq '^location: https://vercel\.com/(login|sso-api)' "$headers" || \
              [[ "$status" == "401" || "$status" == "403" ]]; then
              echo "$label rejected by Vercel automation access (HTTP $status)."
              if [[ -n "$location" ]]; then
                echo "Authentication redirect: ${location%%\?*}"
              fi
              rm -f "$headers" "$body"
              return 3
            fi

            if [[ "$status" == "307" && -n "$expected_redirect" ]]; then
              redirect_path="$location"
              redirect_path="${redirect_path#http://}"
              redirect_path="${redirect_path#https://}"
              if [[ "$redirect_path" != /* ]]; then
                redirect_path="/${redirect_path#*/}"
              fi
              redirect_path="${redirect_path%%\?*}"

              if [[ "$redirect_path" == "$expected_redirect" ]]; then
                echo "$label returned the expected protected rewrite (HTTP 307 → $expected_redirect)."
                rm -f "$headers" "$body"
                return 0
              fi
            fi

            if [[ "$status" != "200" ]]; then
              echo "$label returned unexpected HTTP $status."
              if [[ -n "$location" ]]; then
                echo "Unexpected redirect target: ${location%%\?*}"
              fi
              rm -f "$headers" "$body"
              return 4
            fi

            if [[ -n "$expected_fragment" ]] && ! grep -Fq "$expected_fragment" "$body"; then
              echo "$label did not contain its expected non-sensitive marker."
              rm -f "$headers" "$body"
              return 5
            fi

            echo "$label OK (HTTP 200)."
            rm -f "$headers" "$body"
          }

          request "$DEPLOYMENT_BASE_URL" "/" "deployment /" "" "/index.html"
          request "$DEPLOYMENT_BASE_URL" "/index.html" "deployment /index.html"
          request "$DEPLOYMENT_BASE_URL" "/test" "deployment /test" "Surface de test du framework OSINT"
          request "$DEPLOYMENT_BASE_URL" "/en/test" "deployment /en/test" "OSINT framework test surface"
          request "$DEPLOYMENT_BASE_URL" "/de/test" "deployment /de/test" "Testfläche für das OSINT-Framework"
          request "$DEPLOYMENT_BASE_URL" "/no/test" "deployment /no/test" "Testflate for OSINT-rammeverket"
          request "$DEPLOYMENT_BASE_URL" "/test.html" "deployment /test.html" "d3.v3.min.js"
          request "$DEPLOYMENT_BASE_URL" "/contact" "deployment /contact"
          request "$DEPLOYMENT_BASE_URL" "/policy" "deployment /policy"

          public_result=0
          request "$PUBLIC_BASE_URL" "/" "public www.bababou.com" || public_result=$?
          if [[ "$public_result" == "2" ]]; then
            echo "::warning::www.bababou.com is attached and reaches Vercel, but this GitHub runner is challenged by the Vercel Security Checkpoint."
          elif [[ "$public_result" != "0" ]]; then
            echo "::error::www.bababou.com failed the production alias probe."
            exit "$public_result"
          fi

          {
            echo "## Production deployment smoke"
            echo
            echo "- deployed SHA: \`$DEPLOYED_SHA\`"
            echo "- exact deployment routes: passed"
            if [[ "$public_result" == "2" ]]; then
              echo "- public alias: Vercel Security Checkpoint challenge (informational)"
            else
              echo "- public alias: reachable"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish production post-deploy smoke status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ env.DEPLOYED_SHA }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Production post-deploy smoke passed' ;;
            cancelled) STATE=error; DESCRIPTION='Production post-deploy smoke cancelled' ;;
            *) STATE=failure; DESCRIPTION='Production post-deploy smoke failed' ;;
          esac

          payload="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context 'Production Post-deploy Smoke' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            --data "$payload"
