name: Playwright Browser Cache

on:
  push:
    branches:
      - master
    paths:
      - "package-lock.json"
      - ".github/workflows/playwright-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-browser-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: Seed Chromium cache on default branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Resolve locked Playwright version
        id: playwright-version
        shell: bash
        run: |
          PLAYWRIGHT_VERSION="$(node -e "const lock=require('./package-lock.json'); const version=lock.packages?.['node_modules/@playwright/test']?.version; if (!version) process.exit(2); process.stdout.write(version)")"
          echo "version=${PLAYWRIGHT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Seed Chromium browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright-version.outputs.version }}
        run: npm exec --yes --package="playwright@${PLAYWRIGHT_VERSION}" -- playwright install chromium
