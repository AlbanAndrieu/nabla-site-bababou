---
name: "Copilot Setup Steps"

# Automatically validate the setup when its inputs change, while keeping draft
# iteration cheap. workflow_dispatch stays available to Copilot/operators.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .nvmrc
      - .python-version
      - .pre-commit-config.yaml
      - .pre-commit-pre-push.yaml
      - mise.toml
      - package.json
      - package-lock.json
      - scripts/agent-quality-gate.sh
      - scripts/agent-publish.sh
      - scripts/lib/agent-quality-support.sh
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .nvmrc
      - .python-version
      - .pre-commit-config.yaml
      - .pre-commit-pre-push.yaml
      - mise.toml
      - package.json
      - package-lock.json
      - scripts/agent-quality-gate.sh
      - scripts/agent-publish.sh
      - scripts/lib/agent-quality-support.sh

concurrency:
  group: copilot-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Restore npm downloads
        id: npm-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore pre-commit environments
        id: pre-commit-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v4.6.2-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-pre-push.yaml', '.python-version', '.nvmrc') }}

      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund
          npm --version

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2

      - name: Install repository Git hooks
        shell: bash
        run: |
          set -euo pipefail
          pre-commit install --hook-type pre-commit
          pre-commit install --config .pre-commit-pre-push.yaml --hook-type pre-push

      - name: Prepare pre-commit hook environments
        if: steps.pre-commit-cache.outputs.cache-hit != 'true'
        run: pre-commit install-hooks

      - name: Save pre-commit environments
        if: steps.pre-commit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v4.6.2-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-pre-push.yaml', '.python-version', '.nvmrc') }}

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Save npm downloads
        if: steps.npm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
