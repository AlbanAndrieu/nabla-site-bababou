name: CI (Quality and Security)

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".cursor/**"
      - ".pre-commit-config.yaml"
      - ".pre-commit-pre-push.yaml"
      - "AGENTS.md"
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "mise.toml"
      - "*.{js,cjs,mjs,ts,tsx,json}"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical project checks
        run: npm run check

      # Keep Snyk as an optional gate without referencing its Docker-based
      # GitHub Action. GitHub may prepare container actions before evaluating
      # the step-level condition, which pulled the image even with no token.
      - name: Run Snyk vulnerability scan
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk test
