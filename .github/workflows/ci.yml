name: CI (Quality and Security)

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".cursor/**"
      - ".pre-commit-config.yaml"
      - ".npmrc"
      - ".pre-commit-pre-push.yaml"
      - ".releaserc.yaml"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "mise.toml"
      - "*.{js,cjs,mjs,ts,tsx,json}"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          started_at="$SECONDS"
          npm ci --no-audit --no-fund
          echo "seconds=$((SECONDS - started_at))" >> "$GITHUB_OUTPUT"
          echo "node_modules_mb=$(du -sm node_modules | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          npm_cache="$(npm config get cache)"
          npm_cache_mb="$(du -sm "$npm_cache" 2>/dev/null | awk '{print $1}' || true)"
          echo "npm_cache_mb=${npm_cache_mb:-0}" >> "$GITHUB_OUTPUT"

      - name: Run canonical project checks
        id: checks
        shell: bash
        run: |
          set -euo pipefail
          started_at="$SECONDS"
          npm run check
          echo "seconds=$((SECONDS - started_at))" >> "$GITHUB_OUTPUT"
          echo "next_mb=$(du -sm .next | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Keep Snyk as an optional gate without referencing its Docker-based
      # GitHub Action. GitHub may prepare container actions before evaluating
      # the step-level condition, which pulled the image even with no token.
      - name: Run Snyk vulnerability scan
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk test

      - name: Publish CI performance summary
        if: always() && !cancelled()
        shell: bash
        env:
          NPM_CI_SECONDS: ${{ steps.install.outputs.seconds }}
          NODE_MODULES_MB: ${{ steps.install.outputs.node_modules_mb }}
          NPM_CACHE_MB: ${{ steps.install.outputs.npm_cache_mb }}
          CHECK_SECONDS: ${{ steps.checks.outputs.seconds }}
          NEXT_BUILD_SECONDS: ${{ steps.checks.outputs.next_build_seconds }}
          NEXT_MB: ${{ steps.checks.outputs.next_mb }}
        run: |
          value_or_na() {
            if [[ -n "$1" ]]; then
              printf '%s' "$1"
            else
              printf 'n/a'
            fi
          }

          {
            echo "## CI performance"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| npm ci | $(value_or_na "$NPM_CI_SECONDS") s |"
            echo "| node_modules | $(value_or_na "$NODE_MODULES_MB") MiB |"
            echo "| npm cache | $(value_or_na "$NPM_CACHE_MB") MiB |"
            echo "| npm run check | $(value_or_na "$CHECK_SECONDS") s |"
            echo "| next build | $(value_or_na "$NEXT_BUILD_SECONDS") s |"
            echo "| .next output | $(value_or_na "$NEXT_MB") MiB |"
          } >> "$GITHUB_STEP_SUMMARY"
