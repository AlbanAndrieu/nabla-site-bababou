name: CI (Quality and Security)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".agents/**"
      - ".cursor/**"
      - ".vscode/**"
      - ".pre-commit-config.yaml"
      - ".gitleaks.toml"
      - ".mega-linter.yml"
      - "Makefile"
      - "justfile"
      - ".npmrc"
      - ".envrc"
      - ".nvmrc"
      - ".python-version"
      - ".pre-commit-pre-push.yaml"
      - ".releaserc.yaml"
      - ".github/copilot-instructions*.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - ".dockerignore"
      - ".assetsignore"
      - "Dockerfile"
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "mise.toml"
      - "*.{js,cjs,mjs,ts,tsx,json}"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/vercel-preview.yml"
      - ".github/workflows/zap-preview.yml"
      - ".github/workflows/production-dast.yml"
      - ".github/workflows/post-merge-quality-follow-up.yml"
      - ".zap/**"
  push:
    branches:
      - master
    paths:
      - ".agents/**"
      - ".cursor/**"
      - ".vscode/**"
      - ".pre-commit-config.yaml"
      - ".gitleaks.toml"
      - ".mega-linter.yml"
      - "Makefile"
      - "justfile"
      - ".npmrc"
      - ".envrc"
      - ".nvmrc"
      - ".python-version"
      - ".pre-commit-pre-push.yaml"
      - ".releaserc.yaml"
      - ".github/copilot-instructions*.md"
      - "AGENTS.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - ".dockerignore"
      - ".assetsignore"
      - "Dockerfile"
      - "app/**"
      - "components/**"
      - "i18n/**"
      - "lib/**"
      - "messages/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "unit-tests/**"
      - "mise.toml"
      - "*.{js,cjs,mjs,ts,tsx,json}"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/copilot-setup-steps.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/playwright.yml"
      - ".github/workflows/vercel-preview.yml"
      - ".github/workflows/zap-preview.yml"
      - ".github/workflows/production-dast.yml"
      - ".github/workflows/post-merge-quality-follow-up.yml"
      - ".zap/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      current-base-sha: ${{ steps.current-heads.outputs.base-sha }}
      preview_required: ${{ steps.ci-scope.outputs.preview_required }}
      zap_bootstrap: ${{ steps.ci-scope.outputs.zap_bootstrap }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Resolve current PR base and production branch heads
        id: current-heads
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const baseRef = context.payload.pull_request.base.ref;
            const { data: baseBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: baseRef,
            });
            const baseSha = baseBranch.commit.sha;
            core.setOutput('base-sha', baseSha);
            core.info('Resolved current PR base ' + baseRef + ' HEAD to ' + baseSha);

            const productionRef = context.payload.repository.default_branch;
            const { data: productionBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: productionRef,
            });
            const productionSha = productionBranch.commit.sha;
            core.setOutput('production-sha', productionSha);
            core.info(
              'Resolved current production branch ' +
                productionRef +
                ' HEAD to ' +
                productionSha,
            );

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Run agent preflight before dependency install
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          QUALITY_BASE_REF: ${{ steps.current-heads.outputs.base-sha || github.event.before || 'origin/master' }}
          QUALITY_LOG_TAIL: "120"
        run: bash scripts/agent-quality-gate.sh --preflight

      - name: Report draft preflight-only mode
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        shell: bash
        run: |
          {
            echo "## Draft PR preflight"
            echo
            echo "Git-only agent preflight passed. Node/npm installation and the full Next quality gate are deferred until the PR is ready for review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python for deterministic quality gate
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Restore pre-commit environments
        id: pre-commit-cache
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v4.6.2-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Install pre-commit
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: python -m pip install --disable-pip-version-check --quiet pre-commit==4.6.2

      - name: Run canonical changed-file quality gate before network/SAST/npm bootstrap
        id: canonical-quality-gate
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        continue-on-error: true
        env:
          QUALITY_BASE_REF: ${{ steps.current-heads.outputs.base-sha || github.event.before || 'origin/master' }}
          QUALITY_LOG_TAIL: "40"
        run: bash scripts/quality-gate.sh

      - name: Save pre-commit environments
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.pre-commit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-v4.6.2-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Enforce canonical changed-file quality gate
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.canonical-quality-gate.outcome != 'success'
        run: exit 1

      - name: Verify current production baseline before PR build
        id: verified-production-baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        shell: bash
        env:
          BASE_SHA: ${{ steps.current-heads.outputs.production-sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_BASELINE_RELEASE_HOPS: "3"
          QUALITY_BASELINE_MAINTENANCE_HOPS: "5"
        run: bash scripts/verify-production-baseline.sh

      - name: Revalidate canonical production smoke before PR build
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        shell: bash
        env:
          PRODUCTION_BASE_URL: https://www.bababou.com
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # The previous step has already verified Vercel + production smoke + DAST
          # on the canonical production SHA. If this optional bypass credential is
          # unavailable in the PR context, do not turn that healthy baseline into
          # a false-negative CI failure.
          PRODUCTION_LIVE_ALLOW_MISSING_SECRET: "1"
        run: bash scripts/verify-production-live.sh

      - name: Classify CI change scope
        id: ci-scope
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        shell: bash
        env:
          BASE_SHA: ${{ steps.current-heads.outputs.base-sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-scope.sh "${BASE_SHA}" "${HEAD_SHA}"

      - name: Run Semgrep SAST on changed source
        id: semgrep-sast
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.ci-scope.outputs.sast == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.current-heads.outputs.base-sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA:-}"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$base_sha" =~ ^0+$ ]] || [[ "$base_sha" == "$HEAD_SHA" ]]; then
            base_sha="$(git rev-parse "$HEAD_SHA^")"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$HEAD_SHA" |
              grep -E '^(app|components|i18n|lib|scripts|api)/.*\.(cjs|js|jsx|mjs|py|ts|tsx)$|^\.github/workflows/.*\.ya?ml$|^(next\.config\.mjs|proxy\.ts)$' || true
          )

          if (("${#files[@]}" == 0)); then
            echo "No changed application/source files require Semgrep."
            exit 0
          fi

          printf 'Semgrep SAST targets:\n%s\n' "${files[@]}"
          docker run --rm \
            --env SEMGREP_SEND_METRICS=off \
            --volume "$PWD:/src" \
            --workdir /src \
            semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e \
            semgrep scan \
            --config p/ci \
            --error \
            --metrics=off \
            --sarif \
            --output /src/semgrep.sarif \
            "${files[@]}"

      - name: Upload Semgrep SARIF to GitHub Code Scanning
        id: semgrep-sarif
        if: >-
          always() &&
          steps.ci-scope.outputs.sast == 'true' &&
          vars.ENABLE_CODE_SCANNING_SARIF == 'true' &&
          hashFiles('semgrep.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: "semgrep.sarif"
          category: "semgrep-pr"

      - name: Report Code Scanning SARIF opt-in disabled
        if: >-
          always() &&
          steps.ci-scope.outputs.sast == 'true' &&
          vars.ENABLE_CODE_SCANNING_SARIF != 'true' &&
          hashFiles('semgrep.sarif') != ''
        shell: bash
        env:
          SEMGREP_OUTCOME: ${{ steps.semgrep-sast.outcome }}
        run: |
          {
            echo "## Semgrep SARIF publication"
            echo
            if [[ "$SEMGREP_OUTCOME" == "success" ]]; then
              echo "- Semgrep scan: passed"
              echo "- GitHub Code Scanning upload: skipped (repository feature not enabled)"
              echo "- SARIF artifact: not retained for successful scans"
            else
              echo "- Semgrep scan: $SEMGREP_OUTCOME"
              echo "- GitHub Code Scanning upload: skipped (repository feature not enabled)"
              echo "- Diagnostic report: **semgrep-sast-report** workflow artifact (7 days)"
            fi
            echo
            echo "After enabling GitHub Code Scanning for this private repository, set repository variable `ENABLE_CODE_SCANNING_SARIF=true` to publish Semgrep SARIF to the Security tab."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failed Semgrep SAST report
        if: >-
          always() &&
          steps.ci-scope.outputs.sast == 'true' &&
          steps.semgrep-sast.outcome != 'success' &&
          hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Clean Semgrep SAST workspace
        if: always() && steps.ci-scope.outputs.sast == 'true' && hashFiles('semgrep.sarif') != ''
        shell: bash
        run: rm -f semgrep.sarif

      - name: Enforce Semgrep SAST
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.ci-scope.outputs.sast == 'true' &&
          steps.semgrep-sast.outcome != 'success'
        run: exit 1

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Restore npm downloads
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        id: npm-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Next build cache
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.ci-scope.outputs.build == 'true'
        id: next-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'i18n/**', 'lib/**', 'messages/**', 'next.config.*', 'proxy.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-

      - name: Pin npm
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Install dependencies
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        id: install
        shell: bash
        run: |
          set -euo pipefail
          started_at="$SECONDS"
          npm ci --no-audit --no-fund
          echo "seconds=$((SECONDS - started_at))" >> "$GITHUB_OUTPUT"
          echo "node_modules_mb=$(du -sm node_modules | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          npm_cache="$(npm config get cache)"
          npm_cache_mb="$(du -sm "$npm_cache" 2>/dev/null | awk '{print $1}' || true)"
          echo "npm_cache_mb=${npm_cache_mb:-0}" >> "$GITHUB_OUTPUT"

      - name: Save npm downloads
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && steps.npm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Run maintenance project checks
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.ci-scope.outputs.build != 'true'
        id: maintenance-checks
        shell: bash
        run: |
          set -euo pipefail
          started_at="$SECONDS"
          npm run lint
          npm run lint:css
          npm run test:unit
          echo "seconds=$((SECONDS - started_at))" >> "$GITHUB_OUTPUT"

      - name: Run canonical project checks
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.ci-scope.outputs.build == 'true'
        id: checks
        shell: bash
        run: |
          set -euo pipefail
          started_at="$SECONDS"

          # Keep this sequence equivalent to `npm run check` while exposing
          # the duration of the one real production build.
          npm run check:prebuild

          build_started_ms="$(date +%s%3N)"
          npm run build
          build_elapsed_ms=$(( $(date +%s%3N) - build_started_ms ))
          printf -v build_seconds '%d.%01d' \
            "$((build_elapsed_ms / 1000))" \
            "$(((build_elapsed_ms % 1000) / 100))"
          echo "next_build_seconds=$build_seconds" >> "$GITHUB_OUTPUT"

          npm run check:postbuild

          echo "seconds=$((SECONDS - started_at))" >> "$GITHUB_OUTPUT"
          echo "next_mb=$(du -sm .next | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Save Next build cache
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.ci-scope.outputs.build == 'true' &&
          steps.next-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'i18n/**', 'lib/**', 'messages/**', 'next.config.*', 'proxy.ts', 'tsconfig.json') }}

      # Keep Snyk as an optional dependency-change gate without referencing its
      # Docker GitHub Action. No dependency delta means no Snyk process/download.
      - name: Run Snyk vulnerability scan
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
          steps.ci-scope.outputs.dependencies == 'true' &&
          env.SNYK_TOKEN != ''
        run: npx --yes snyk test

      - name: Publish CI performance summary
        if: always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        shell: bash
        env:
          APPLICATION_SCOPE: ${{ steps.ci-scope.outputs.application }}
          BUILD_SCOPE: ${{ steps.ci-scope.outputs.build }}
          SAST_SCOPE: ${{ steps.ci-scope.outputs.sast }}
          DEPENDENCY_SCOPE: ${{ steps.ci-scope.outputs.dependencies }}
          NPM_CI_SECONDS: ${{ steps.install.outputs.seconds }}
          NODE_MODULES_MB: ${{ steps.install.outputs.node_modules_mb }}
          NPM_CACHE_MB: ${{ steps.install.outputs.npm_cache_mb }}
          NPM_CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          NEXT_CACHE_HIT: ${{ steps.next-cache.outputs.cache-hit }}
          MAINTENANCE_CHECK_SECONDS: ${{ steps.maintenance-checks.outputs.seconds }}
          CHECK_SECONDS: ${{ steps.checks.outputs.seconds }}
          NEXT_BUILD_SECONDS: ${{ steps.checks.outputs.next_build_seconds }}
          NEXT_MB: ${{ steps.checks.outputs.next_mb }}
        run: |
          value_or_na() {
            if [[ -n "$1" ]]; then
              printf '%s' "$1"
            else
              printf 'n/a'
            fi
          }

          {
            echo "## CI performance"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| application scope | $(value_or_na "$APPLICATION_SCOPE") |"
            echo "| build gate | $(value_or_na "$BUILD_SCOPE") |"
            echo "| Semgrep source gate | $(value_or_na "$SAST_SCOPE") |"
            echo "| dependency gate | $(value_or_na "$DEPENDENCY_SCOPE") |"
            echo "| npm ci | $(value_or_na "$NPM_CI_SECONDS") s |"
            echo "| node_modules | $(value_or_na "$NODE_MODULES_MB") MiB |"
            echo "| npm cache | $(value_or_na "$NPM_CACHE_MB") MiB |"
            echo "| npm cache hit | $(value_or_na "$NPM_CACHE_HIT") |"
            echo "| maintenance checks | $(value_or_na "$MAINTENANCE_CHECK_SECONDS") s |"
            echo "| Next build cache hit | $(value_or_na "$NEXT_CACHE_HIT") |"
            echo "| npm run check | $(value_or_na "$CHECK_SECONDS") s |"
            echo "| next build | $(value_or_na "$NEXT_BUILD_SECONDS") s |"
            echo "| .next output | $(value_or_na "$NEXT_MB") MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check CI performance warning budgets
        if: always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        shell: bash
        env:
          NPM_CI_SECONDS: ${{ steps.install.outputs.seconds }}
          NODE_MODULES_MB: ${{ steps.install.outputs.node_modules_mb }}
          CHECK_SECONDS: ${{ steps.checks.outputs.seconds }}
          NEXT_BUILD_SECONDS: ${{ steps.checks.outputs.next_build_seconds }}
          NEXT_MB: ${{ steps.checks.outputs.next_mb }}
        run: bash scripts/ci-performance-budget.sh

  preview-security:
    name: Vercel Preview security gates
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.quality.result == 'success' &&
      needs.quality.outputs.preview_required == 'true'
    timeout-minutes: 35
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      statuses: write

    steps:
      - name: Resolve automatic Preview checkpoint
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open.`);
              return;
            }
            if (pr.draft) {
              core.setFailed(`PR #${prNumber} returned to draft before Preview publication.`);
              return;
            }
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('Automatic Preview checkpoints are limited to branches from this repository.');
              return;
            }
            if (pr.head.sha !== headSha) {
              core.setFailed(
                `PR #${prNumber} head moved from ${headSha} to ${pr.head.sha}; a newer Quality run must publish the checkpoint.`,
              );
              return;
            }

            core.setOutput('sha', headSha);
            core.setOutput('branch', `vercel-preview-pr-${prNumber}`);
            core.info(
              `Canonical Quality scope requires automatic Preview for PR #${prNumber}.`,
            );

      - name: Checkout exact PR revision for Preview
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.preview.outputs.sha }}
          fetch-depth: 0

      - name: Push automatic Vercel Preview checkpoint
        env:
          CHECKPOINT_BRANCH: ${{ steps.preview.outputs.branch }}
          PR_BASE_SHA: ${{ needs.quality.outputs.current-base-sha }}
          PR_HEAD_SHA: ${{ steps.preview.outputs.sha }}
        shell: bash
        run: >-
          bash scripts/publish-vercel-preview-checkpoint.sh
          "${CHECKPOINT_BRANCH}" "${PR_BASE_SHA}" "${PR_HEAD_SHA}"

      - name: Wait for Vercel, Playwright and ZAP Preview statuses
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STATUS_SHA: ${{ steps.preview.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ZAP_BOOTSTRAP: ${{ needs.quality.outputs.zap_bootstrap }}
        with:
          retries: 3
          script: |
            const sha = process.env.STATUS_SHA;
            const prNumber = Number(process.env.PR_NUMBER);
            const expected =
              process.env.ZAP_BOOTSTRAP === 'true'
                ? new Set(['Vercel', 'Playwright Preview E2E'])
                : new Set([
                    'Vercel',
                    'Playwright Preview E2E',
                    'OWASP ZAP Preview',
                  ]);

            if (process.env.ZAP_BOOTSTRAP === 'true') {
              core.warning(
                'This PR changes zap-preview.yml. repository_dispatch uses the default-branch workflow, so the new ZAP definition cannot be runtime-validated from this PR. The exact Vercel Preview and Playwright remain required; the stale master ZAP result is allowed to settle and is then replaced by an explicit deferred/bootstrap status.',
              );
            }
            const deadline = Date.now() + 25 * 60 * 1000;
            const vercelRegistrationDeadline = Date.now() + 2 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data: livePr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              if (livePr.head.sha !== sha) {
                core.info(
                  `PR #${prNumber} moved from ${sha} to ${livePr.head.sha}; stop waiting on stale Preview statuses.`,
                );
                return;
              }

              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });

              const latest = new Map();
              for (const status of data) {
                if (!latest.has(status.context)) {
                  latest.set(status.context, status);
                }
              }

              const summary = [...expected].map((context) => {
                const status = latest.get(context);
                return `${context}=${status?.state ?? 'absent'}`;
              });
              core.info(`Preview security statuses: ${summary.join(', ')}`);

              const vercelStatus = latest.get('Vercel');
              if (
                !vercelStatus &&
                Date.now() >= vercelRegistrationDeadline
              ) {
                core.setFailed(
                  `Vercel status was not registered within 2 minutes for ${sha}; no Preview deployment evidence was created.`,
                );
                return;
              }

              for (const context of expected) {
                const status = latest.get(context);
                if (status && ['failure', 'error'].includes(status.state)) {
                  core.setFailed(
                    `${context} failed for ${sha}: ${status.description ?? status.state}`,
                  );
                  return;
                }
              }

              if (
                [...expected].every(
                  (context) => latest.get(context)?.state === 'success',
                )
              ) {
                core.summary
                  .addHeading('Preview security gates')
                  .addList([
                    `Exact SHA: ${sha}`,
                    'Vercel Preview: success',
                    'Playwright Preview E2E: success',
                    process.env.ZAP_BOOTSTRAP === 'true'
                      ? 'OWASP ZAP Preview: deferred (workflow bootstrap; no new scanner claim)'
                      : 'OWASP ZAP Preview: success',
                  ]);
                await core.summary.write();
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            core.setFailed(
              `Timed out waiting for ${[...expected].join(' and ')} on ${sha}.`,
            );

      - name: Publish deferred ZAP workflow-bootstrap status
        if: needs.quality.outputs.zap_bootstrap == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          STATUS_SHA: ${{ steps.preview.outputs.sha }}
        with:
          script: |
            const sha = process.env.STATUS_SHA;
            const contextName = 'OWASP ZAP Preview';
            const started = Date.now();
            const deadline = started + 3 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });
              const status = data.find((item) => item.context === contextName);

              if (status && status.state !== 'pending') {
                core.info(
                  `Observed stale default-branch ZAP status ${status.state}; replacing it with an explicit workflow-bootstrap defer.`
                );
                break;
              }
              if (!status && Date.now() - started > 30000) {
                core.info('No stale ZAP status appeared during the bootstrap grace period.');
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: contextName,
              description: 'Deferred: ZAP workflow bootstrap; Playwright passed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.notice(
              'OWASP ZAP Preview is explicitly deferred for this workflow-bootstrap PR; no new ZAP scan result is claimed.',
            );
