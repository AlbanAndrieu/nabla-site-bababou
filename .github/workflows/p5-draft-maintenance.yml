name: P5 draft metadata maintenance

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'AlbanAndrieu/nabla-site-bababou' && github.event.pull_request.number == 185 && github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Pin npm
        shell: bash
        run: cd "${RUNNER_TEMP}" && npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Reconcile lock metadata and roadmap
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "${RUNNER_TEMP}/package-lock.before.json"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          python3 scripts/p5-draft-maintenance.py "${RUNNER_TEMP}/package-lock.before.json"

      - name: Commit deterministic metadata updates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > "${RUNNER_TEMP}/changed-files.txt"
          printf '%s\n' docs/roadmap.md package-lock.json | sort > "${RUNNER_TEMP}/expected-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/changed-files.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/roadmap.md
          git commit -m "chore(p5): sync lockfile and post-merge evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
