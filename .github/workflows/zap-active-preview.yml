name: ZAP active preview (manual, protected)

# Active scanners submit requests and may mutate data. Never on production or PR.
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Exact authorized Vercel Preview HTTPS URL"
        required: true
        type: string
      deployed_sha:
        description: "Exact deployed 40-char source commit"
        required: true
        type: string
      preview_ref:
        description: "vercel-preview-pr-233 (or another verified checkpoint)"
        required: true
        type: string
      active_scan_approved:
        description: "I authorize intrusive DAST only against this isolated Preview"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zap-active-preview
  cancel-in-progress: true

jobs:
  active:
    if: inputs.active_scan_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate exact checkpoint and restricted destination
        env:
          TARGET: ${{ inputs.preview_url }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          REF: ${{ inputs.preview_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET" =~ ^https://[a-z0-9-]+\.vercel\.app/?$ ]]; then
            echo "::error::Only an exact HTTPS Vercel Preview hostname is allowed"
            exit 1
          fi
          if [[ ! "$REF" =~ ^vercel-preview-pr-[0-9]+$ ]] || [[ ! "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid Preview checkpoint SHA or branch"
            exit 1
          fi
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${REF}" --jq '.object.sha')"
          test "$actual" = "$DEPLOYED_SHA" || { echo "::error::Preview checkpoint SHA mismatch"; exit 1; }
      - name: Checkout exact reviewed DAST policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.deployed_sha }}
          persist-credentials: false
          sparse-checkout: |
            .zap/rules.tsv
          sparse-checkout-cone-mode: false
      - name: Require protected-preview authentication
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TARGET: ${{ inputs.preview_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" || { echo "::error::Preview bypass credential is required"; exit 1; }
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 12 -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "$TARGET")"
          [[ "$status" == "200" ]] || { echo "::error::Preview access refused"; exit 1; }
      - name: ZAP full active scan — explicitly approved, bounded spider
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        env:
          ZAP_AUTH_HEADER: x-vercel-protection-bypass
          ZAP_AUTH_HEADER_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ZAP_AUTH_HEADER_SITE: ${{ inputs.preview_url }}
        with:
          target: ${{ inputs.preview_url }}
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-active-preview-report
          cmd_options: "-I -m 1 -T 5"
      - name: Block high-risk active findings
        shell: bash
        run: |
          set -euo pipefail
          test -s report_json.json || { echo "::error::Missing active DAST evidence"; exit 1; }
          high="$(jq '[.site[]?.alerts[]? | select((.riskcode | tostring) == "3")] | length' report_json.json)"
          echo "Active DAST: ${high} HIGH alert categories" >> "$GITHUB_STEP_SUMMARY"
          (( high == 0 )) || { echo "::error::High-risk active DAST finding"; exit 1; }
      - name: Remove raw HTTP evidence from runner
        if: always()
        shell: bash
        run: rm -f report_html.html report_json.json report_md.md zap.yaml
