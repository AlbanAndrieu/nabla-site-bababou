name: OWASP ZAP Preview

on:
  repository_dispatch:
    types:
      - vercel.deployment.success

permissions:
  contents: read
  statuses: write

concurrency:
  group: zap-preview-${{ github.event.client_payload.git.ref || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Scan exact Vercel Preview
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.url != '' &&
      github.event.client_payload.git.sha != '' &&
      github.event.client_payload.environment != 'production' &&
      github.event.client_payload.git.ref != 'master' &&
      (startsWith(github.event.client_payload.git.ref, 'vercel-preview-pr-') ||
       startsWith(github.event.client_payload.git.ref, 'refs/heads/vercel-preview-pr-'))
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE_URL: ${{ github.event.client_payload.url }}
      PREVIEW_REF: ${{ github.event.client_payload.git.ref }}
      DEPLOYED_SHA: ${{ github.event.client_payload.git.sha }}
      ZAP_AUTH_HEADER: x-vercel-protection-bypass
      ZAP_AUTH_HEADER_VALUE: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Verify Preview belongs to the current PR head
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_REF: ${{ env.PREVIEW_REF }}
          DEPLOYED_SHA: ${{ env.DEPLOYED_SHA }}
        with:
          script: |
            const ref = process.env.PREVIEW_REF.replace(/^refs\/heads\//, '');
            const match = /^vercel-preview-pr-(\d+)$/.exec(ref);
            if (!match) {
              core.setFailed(`Unexpected Vercel Preview ref: ${process.env.PREVIEW_REF}`);
              return;
            }

            const prNumber = Number(match[1]);
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.setFailed(`PR #${prNumber} is not open.`);
              return;
            }
            if (pr.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo) {
              core.setFailed('ZAP Preview scans are limited to branches from this repository.');
              return;
            }
            if (pr.head.sha !== process.env.DEPLOYED_SHA) {
              core.setFailed(
                `Preview SHA ${process.env.DEPLOYED_SHA} does not match PR #${prNumber} head ${pr.head.sha}.`,
              );
              return;
            }

            core.setOutput('pr_number', String(prNumber));
            core.info(`ZAP will scan PR #${prNumber} exact head ${pr.head.sha}.`);

      - name: Verify protected Vercel Preview access
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ZAP_AUTH_HEADER_VALUE:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is required for ZAP Preview scans."
            exit 1
          fi

          preview_host="${PREVIEW_BASE_URL#http://}"
          preview_host="${preview_host#https://}"
          preview_host="${preview_host%%/*}"
          case "$preview_host" in
            *.vercel.app) ;;
            *)
              echo "::error::ZAP target must be an exact Vercel deployment URL (*.vercel.app), got: $preview_host"
              exit 1
              ;;
          esac
          echo "ZAP_AUTH_HEADER_SITE=$preview_host" >> "$GITHUB_ENV"

          headers="$(mktemp)"
          status="$(curl --silent --show-error \
            --output /dev/null \
            --dump-header "$headers" \
            --write-out '%{http_code}' \
            --header "$ZAP_AUTH_HEADER: $ZAP_AUTH_HEADER_VALUE" \
            "$PREVIEW_BASE_URL/")"
          mitigated="$(awk 'BEGIN { IGNORECASE=1 } /^x-vercel-mitigated:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"

          if [[ "$status" == "429" || "${mitigated,,}" == "challenge" ]]; then
            echo "::error::ZAP target reached the Vercel Security Checkpoint instead of the Preview."
            exit 1
          fi
          if grep -Eiq '^location: https://vercel\.com/(login|sso-api)' "$headers" || \
            [[ "$status" == "401" || "$status" == "403" ]]; then
            echo "::error::Vercel rejected the ZAP automation bypass."
            exit 1
          fi
          if [[ ! "$status" =~ ^[23][0-9][0-9]$ ]]; then
            echo "::error::Preview access preflight returned unexpected HTTP $status."
            exit 1
          fi

          echo "ZAP Preview access accepted for $preview_host (HTTP $status)."
          rm -f "$headers"

      - name: Run OWASP ZAP baseline against Vercel Preview
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          target: ${{ env.PREVIEW_BASE_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-preview-${{ env.DEPLOYED_SHA }}

      - name: Publish ZAP Preview status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ env.DEPLOYED_SHA }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='ZAP Preview baseline completed' ;;
            cancelled) STATE=error; DESCRIPTION='ZAP Preview baseline cancelled' ;;
            *) STATE=failure; DESCRIPTION='ZAP Preview baseline failed' ;;
          esac

          payload="$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context 'OWASP ZAP Preview' \
            '{state: $state, target_url: $target_url, description: $description, context: $context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$STATUS_SHA" \
            --data "$payload"
