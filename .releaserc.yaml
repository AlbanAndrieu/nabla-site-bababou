branches:
  - master

tagFormat: "${version}"

plugins:
  # Determine SemVer bumps from Conventional Commits. Keep `feature:` as the
  # same project-level alias used by fastapi-sample for a MINOR release.
  - - "@semantic-release/commit-analyzer"
    - releaseRules:
        - type: feature
          release: minor
  - "@semantic-release/release-notes-generator"

  # Generate and maintain the repository changelog before the release commit.
  - "@semantic-release/changelog"

  # This is a private web application, not an npm package. Keep the checked-in
  # package metadata synchronized without publishing anything to npm.
  - "./scripts/semantic-release-version.mjs"

  # Commit generated release metadata back to the release branch.
  - - "@semantic-release/git"
    - assets:
        - "CHANGELOG.md"
        - "package.json"
        - "package-lock.json"
      message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"

  # Publish the GitHub Release without commenting on or labelling every PR in
  # the release range. The Actions run and GitHub Release remain the sources of
  # release status, while historical PRs stay free of automated release noise.
  - - "@semantic-release/github"
    - successComment: false
      releasedLabels: false
