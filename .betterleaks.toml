# Betterleaks v1 policy.
# Keep reviewed allowlists stable and use this file explicitly in local/CI scans.
title = "Betterleaks policy"
betterleaksMinVersion = "v1.9.0"
# Compatibility floor for the inherited Gitleaks config schema consumed by Betterleaks.
minVersion = "v8.25.0"

[extend]
useDefault = true

[allowlist]
description = "global allow lists"
regexes = [
    '''219-09-9999''',
    '''078-05-1120''',
    '''(9[0-9]{2}|666)-\d{2}-\d{4}''',
    '''#nosec''',
    '''betterleaks:allow''',
    '''password-reset-XXX''',
    '''sk-1234567890''',
    '''tg3zLMS/bebJFl0LxctiCw''',
    '''data-key=^[A-Za-z0-9]+/[A-Za-z0-9+/=]{10,70}$''',
]
paths = [
    '''\.betterleaks\.toml$''',
    '''(.*?)(jpg|gif|doc|docx|zip|xls|pdf|bin|svg|socket|vsidx|v2|suo|wsuo|\.dll|pdb|exe)$''',
    '''(go.mod|go.sum|go.work|go.work.sum)$''',
    '''gradle.lockfile''',
    '''megalinter-reports''',
    '''node_modules''',
    '''\.mypy_cache''',
    '''vue-client/node_modules''',
    '''package-lock.json''',
    '''yarn.lock''',
    '''pnpm-lock.yaml''',
    '''Database.refactorlog''',
    '''vendor/''',
    '''\.venv/''',
    '''\.direnv/''',
    '''\.tox/''',
    '''environment.yml''',
    '''\.terraform''',
]
